  <style>
    :root {
      --ink: #142d4a;
      --muted: #52677f;
      --paper: #f7fafd;
      --white: #ffffff;
      --burgundy: #173d63;
      --burgundy-dark: #0e2742;
      --gold: #2876a6;
      --gold-light: #b9dffa;
      --line: rgba(25, 64, 99, .15);
      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; width: 100%; object-fit: cover; }

    .container { width: min(1220px, calc(100% - 48px)); margin-inline: auto; }

    .site-header {
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.92);
    }

    .header-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
    }

    .brand img {
      width: auto;
      height: 52px;
      max-width: 52px;
      border-radius: 12px;
      object-fit: contain;
    }

    .brand-name {
      font: 600 14px var(--serif);
      letter-spacing: .025em;
    }

    .brand-name small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font: 600 8px var(--sans);
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .back-link {
      color: var(--burgundy);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
    }

    main {
      padding: 74px 0 100px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--burgundy);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 22px;
      height: 1px;
      background: var(--gold);
      content: "";
    }

    h1 {
      max-width: 720px;
      margin: 16px 0 12px;
      color: var(--burgundy);
      font: 500 clamp(40px, 6vw, 68px)/1.05 var(--serif);
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 560px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
      margin-top: 38px;
    }

    .product-note {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
      font-style: italic;
    }

    .product-button {
      position: relative;
      min-height: 120px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 18px 16px;
      border: 1px solid rgba(23, 61, 99, .14);
      border-radius: 14px;
      background: var(--white);
      color: var(--burgundy);
      font: 700 15px/1.4 var(--sans);
      text-align: center;
      box-shadow: 0 12px 22px rgba(14,39,66,.04);
      overflow: hidden;
      cursor: default;
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease, color .3s ease;
      animation: tileFadeIn .6s ease both;
      animation-delay: calc(var(--tile-index, 0) * 60ms);
    }

    .product-button::before {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: var(--burgundy);
      transform: translateX(-101%);
      transition: transform .8s ease;
      content: "";
      z-index: 0;
    }

    .product-button span {
      position: relative;
      z-index: 1;
      transition: color .3s ease;
    }

    .product-button:hover,
    .product-button:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(23, 61, 99, .18);
      box-shadow: 0 18px 28px rgba(14,39,66,.12);
      outline: none;
    }

    .product-button:hover::before,
    .product-button:focus-visible::before {
      transform: translateX(0);
    }

    .product-button:hover span,
    .product-button:focus-visible span {
      color: var(--white);
    }

    .product-button:active {
      transform: translateY(-1px);
      box-shadow: 0 14px 22px rgba(14,39,66,.1);
      background: rgba(23, 61, 99, .04);
    }

    @media (hover: none) {
      .product-button:active {
        box-shadow: 0 14px 26px rgba(14,39,66,.12);
      }

      .product-button:active::before {
        transform: translateX(0);
      }

      .product-button:active span {
        color: var(--white);
      }
    }

    @keyframes tileFadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 980px) {
      .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .product-button {
        animation: none;
        transition: none;
      }

      .product-button::before {
        transition: none;
      }
    }

    @media (max-width: 640px) {
      .container { width: calc(100% - 38px); }
      .header-inner { min-height: 68px; }
      .brand img { width: auto; height: 44px; max-width: 44px; object-fit: contain; }
      .brand-name { font-size: 12px; }
      .back-link { font-size: 10px; }
      main { padding: 55px 0 72px; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>

      <button class="product-button" type="button" style="--tile-index: 11"><span>Bidding</span></button>

    </div>
    <p class="product-note">The more products can be added later!</p>
  </main>
